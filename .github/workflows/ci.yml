name: PhishGuard AI - CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Pytest & Verification Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: phishguard
          POSTGRES_PASSWORD: phishguard_secret_2026
          POSTGRES_DB: phishguard_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Phase 1 Verification Tests
        run: python backend/tests/run_tests.py

      - name: Execute Phase 2 Verification Tests
        run: python backend/tests/test_url_engine.py

      - name: Execute Phase 3 Verification Tests
        run: python backend/tests/test_phase3.py

      - name: Execute Phase 4 Verification Tests
        run: python backend/tests/test_phase4.py

      - name: Execute Phase 5 Verification Tests
        run: python backend/tests/test_phase5.py

  frontend-build:
    name: Frontend TypeScript & Vite Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Verify TypeScript Compilation & Build
        run: |
          cd frontend
          npm run build

  docker-build-check:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t phishguard-backend ./backend

      - name: Build Frontend Docker Image
        run: docker build -t phishguard-frontend ./frontend
